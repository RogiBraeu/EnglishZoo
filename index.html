  const g = c.getContext("2d"), o = outline ? 1 : 0;

  }
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== "." && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x + o, y + o, 1, 1); } }));
  return this.cache[key] = c;

      const d = this.modal(`<p class="dlg-title">Fortschritt wiederherstellen</p>
        <p class="small">Füge hier deinen Sicherungscode ein.</p>
        <textarea class="bk-code" data-bk-in ${U.inputAttrs}></textarea>
        <p class="bk-err" data-bk-err></p>
        <button class="btn primary big" data-bk-go>Wiederherstellen</button>
        <button class="btn ghost" data-x>Abbrechen</button>`);
      d.querySelector("[data-bk-go]").onclick = async () => {
        const err = d.querySelector("[data-bk-err]");
        try {
          const data = await this.importCode(d.querySelector("[data-bk-in]").value);
          const box = d.querySelector(".dlg-box");
          box.innerHTML = `<p class="dlg-title">Code ist gültig ✓</p>
            <p>Dein jetziger Fortschritt auf diesem Handy wird dabei <b>ersetzt</b>.</p>
            <button class="btn primary big" data-bk-ok>Ja, wiederherstellen</button><button class="btn ghost" data-x>Abbrechen</button>`;
          box.querySelector("[data-x]").onclick = () => { d.hidden = true; };
          box.querySelector("[data-bk-ok]").onclick = () => {
            Store.data = Object.assign(Store.defaults(), data); Store.save();
            location.reload();
          };
        } catch (e) { err.textContent = e.message && /Code|Gerät|App/.test(e.message) ? e.message : "Der Code stimmt nicht. Bitte ganz kopieren."; }
      };
    };
  }
};

/* Erzeugt aus einer Routine CSS-Animationen (pro Bild eine Spur) */
const Routine = {
  done: {},
  parts(s) {
    const fx = Array.isArray(s.fx) ? s.fx : s.fx ? [s.fx] : [];
    return [{ k: s.f, f: s.f, a: s.a, b: s.b, flip: s.flip, rot: s.rot }].concat(fx.map(x => ({ k: x.id || x.f, f: x.f, a: x.a, b: x.b, flip: !!x.flip })));
  },
  build(key, segs, once) {
    if (this.done[key]) return this.done[key];
    const T = segs.reduce((s, x) => s + x.t, 0);
    const tracks = {}, sprites = {};
    const add = (k, p, props) => { (tracks[k] = tracks[k] || []).push([p, props]); };
    const pos = (xy, flip, r) => `left:${(100 * xy[0] / 64).toFixed(3)}%;top:${(100 * xy[1] / 44).toFixed(3)}%;transform:scaleX(${flip ? -1 : 1}) rotate(${r || 0}deg)`;
    segs.forEach(s => this.parts(s).forEach(v => sprites[v.k] = v.f));
    const keys = Object.keys(sprites);
    let t = 0;
    const sounds = [];
    segs.forEach(s => {
      const p0 = 100 * t / T, p1 = 100 * (t + s.t) / T;
      if (s.sound) sounds.push({ sound: s.sound, at: t });
      t += s.t;
      const vis = new Map(this.parts(s).map(v => [v.k, v]));
      keys.forEach(k => {
        const v = vis.get(k);
        if (v) { add(k, p0 + 0.01, "opacity:1;" + pos(v.a, v.flip, v.rot && v.rot[0])); add(k, p1, "opacity:1;" + pos(v.b || v.a, v.flip, v.rot && v.rot[1])); }
        else { add(k, p0 + 0.01, "opacity:0"); add(k, p1, "opacity:0"); }
      });
    });
    let css = "";
    const list = keys.map(k => {
      const cls = `rt_${key}_${k}`;
      const stops = tracks[k].map(([p, pr]) => `${Math.min(100, p).toFixed(3)}%{${pr}}`).join("");
      css += `@keyframes ${cls}{0%{opacity:0}${stops}}.${cls}{animation:${cls} ${T.toFixed(2)}s linear ${once ? "1 forwards" : "infinite"};}`;
      return { k, f: sprites[k], cls };
    });
    const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
    return this.done[key] = { T, list, sounds };
  },
  /* Bilder der Routine in eine Szene setzen */
  mount(el, key, segs, opts) {
    opts = opts || {};
    const r = this.build(key, segs, opts.once);
    let first = null;
    r.list.forEach(({ f, cls }) => {
      const s = Pix.size(f);
      const wrap = document.createElement("div");
      wrap.className = "actor " + cls;
      wrap.style.width = (100 * s.w / 64) + "%";
      if (opts.delay) wrap.style.animationDelay = (-r.T * opts.delay).toFixed(2) + "s";
      const c = Pix.icon(f); c.className = "px-frame" + (ANIMALS.some(a => a.id === f) ? " step" : "");
      wrap.appendChild(c); el.appendChild(wrap);
      if (!first) first = wrap;
    });
    // Töne passend zur Animation (über eine unsichtbare CSS-Spur, kein Timer)
    // Töne bei jeder Wiederholung der Runde, im Takt der Animation – auch in der Zoo-Übersicht.
    // Still während der Aufgaben; ist ein Gehege groß geöffnet, tönt nur dieses (nicht doppelt).
    if (opts.sound) r.sounds.forEach(sd => {
      const cue = document.createElement("div"); cue.className = "cue";
      cue.style.animationDuration = r.T.toFixed(2) + "s";
      cue.style.animationDelay = sd.at.toFixed(2) + "s";
      cue.style.animationIterationCount = opts.once ? "1" : "infinite";
      const ring = () => {
        if (!cue.isConnected || document.hidden || document.body.classList.contains("in-lesson")) return;
        const dlg = document.querySelector(".dialog:not([hidden])");
        if (dlg && !dlg.contains(cue)) return;
        Sound.play(sd.sound);
      };
      cue.addEventListener("animationstart", ring);
      cue.addEventListener("animationiteration", ring);
      el.appendChild(cue);
    });
    if (opts.onEnd && first) first.addEventListener("animationend", e => { if (e.target === first) opts.onEnd(); }, { once: false });
    return first;
  }
};

const App = {
  view: "zoo",
  get A() { return Store.data.app; },

  init() {
    Engine.init({ storageKey: "zoo-vokabeln-v1", onXP: n => {
      const A = this.A, t = U.today();
      A.wallet += n; A.xpDays = A.xpDays || {}; A.xpDays[t] = (A.xpDays[t] || 0) + n;
      Object.keys(A.xpDays).forEach(d => { if (+d < t - 60) delete A.xpDays[d]; });
      Store.save();
    } });
    if (!this.pwaReady) { PWA.init({ prefix: "ZOO1" }); this.pwaReady = true; }
    const A = this.A;
    if (!A.init) {
      Object.assign(A, { init: true, wallet: 0, inv: { fish: 1, meat: 0, feed: 0 }, animals: {}, unlocked: [], event: null,
        lastEventRoll: null, setId: Data.sets[0].id, welcome: [], toys: {}, days: {} });
    }
    if (!Data.set(A.setId)) A.setId = Data.sets[0].id;
    A.toys = A.toys || {}; A.days = A.days || {};
    A.stats = A.stats || {}; A.trophies = A.trophies || {}; A.trophyQueue = A.trophyQueue || []; A.xpDays = A.xpDays || {};
    A.decos = A.decos || {};
    A.jokers = A.jokers || 0; A.jokerAwarded = A.jokerAwarded || 0; A.jokerNew = A.jokerNew || 0;
    this.ensureAnimals(true);
    this.checkHoliday();
    this.rollEvent();
    Store.save();
    this.render();
  },

  /* ---------- Spiellogik ---------- */
  donePacks() { return Data.sets.reduce((n, s) => n + Plan.packs(s.id).filter(p => p.done).length, 0); },
  ensureAnimals(first) {
    const A = this.A, t = U.today();
    const target = Math.min(ANIMALS.length, ZOO.START_ANIMALS + this.donePacks());
    const isStart = A.unlocked.length === 0;
    while (A.unlocked.length < target) {
      const a = ANIMALS.find(x => !A.unlocked.includes(x.id));
      A.unlocked.push(a.id);
      A.animals[a.id] = { fed: t - 1, clean: t };
      if (!isStart || A.unlocked.length > ZOO.START_ANIMALS) A.welcome.push(a.id);
    }
    Store.save();
  },
  animal(id) { return ANIMALS.find(a => a.id === id); },
  hunger(id) { return Math.min(2, U.today() - this.A.animals[id].fed); },
  dirt(id) { return Math.min(2, U.today() - this.A.animals[id].clean); },
  /* Deutsch mit englischer Zeile darunter (1:1) */
  bi(de, en) { return `<span class="bi"><span>${de}</span><em class="en">${en}</em></span>`; },

  hasFriend(id) { return !!(this.A.animals[id] && this.A.animals[id].friend); },
  portions(id) { return this.hasFriend(id) ? 2 : 1; },
  /* heute schon gegebene Portionen (bei zwei Tieren braucht es zwei) */
  fedToday(id) { const x = this.A.animals[id]; if (x.fed === U.today()) return this.portions(id); return x.part && x.part.day === U.today() ? x.part.n : 0; },
  friendRoutine(id) {
    const F = FRIENDS[id];
    if (F.own === "owl2") return OWL2;
    const mv = xy => xy && [xy[0] + F.dx, xy[1] + F.dy];
    return ROUTINES[id].map(sg => Object.assign({}, sg, { a: mv(sg.a), b: mv(sg.b),
      fx: sg.fx && [].concat(sg.fx).map(x => Object.assign({}, x, { a: mv(x.a), b: mv(x.b) })) }));
  },
  stat(k) { return (this.A.stats && this.A.stats[k]) || 0; },
  bump(k) { this.A.stats[k] = this.stat(k) + 1; Store.save(); },
  season() {
    if (TEST_MODE && this.A.seasonTest) { const t = SEASONS.find(x => x.id === this.A.seasonTest); if (t) return t; }
    const d = new Date(), md = (d.getMonth() + 1) * 100 + d.getDate();
    return SEASONS.find(x => x.from <= x.to ? md >= x.from && md <= x.to : md >= x.from || md <= x.to) || SEASONS[0];
  },
  /* Aussehen der Gehege je Jahreszeit (gratis, nur angedeutet) */
  look() { return { autumn: "autumn", xmas: "winter", winter: "winter", spring: "spring", easter: "spring", latesummer: "late" }[this.season().id] || null; },
  seasonDecos() { const s = this.season(); return DECOS.filter(d => d.season === s.id); },
  hasDeco(id, aid) { return ((this.A.decos || {})[id] || []).includes(aid); },
  decoVariant(item, aid) {
    const i = Math.max(0, ANIMALS.findIndex(a => a.id === aid)), c1 = DECO_COLORS[i % DECO_COLORS.length], c2 = DECO_COLORS[(i + 3) % DECO_COLORS.length];
    if (item.id === "pumpkin") return { name: i % 2 ? "pumpkin2" : "pumpkin", map: {} };
    if (item.id === "lantern") return { name: "lantern", map: { B: c1, A: "#fff2a8" } };
    if (item.id === "xtree") return { name: "xtree", map: { B: c1, C: c2 }, outline: true };
    if (item.id === "presents") return { name: "presents", map: { B: c1, C: c2 } };
    if (item.id === "lights") return { name: "lightsicon", map: {} };
    if (item.id === "ghost") return GHOSTS[aid] || { name: "ghost", map: {} };
    return { name: item.id, map: {} };
  },
  decoIcon(item, aid) {
    const v = this.decoVariant(item, aid), src = Pix.variant(v.name, v.map, v.outline);
    const c = document.createElement("canvas"); c.width = src.width; c.height = src.height; c.getContext("2d").drawImage(src, 0, 0);
    c.className = "px-icon"; return c;
  },
  paintDeco(el, a) {
    this.seasonDecos().forEach(item => {
      if (!this.hasDeco(item.id, a.id)) return;
      if (item.slot === "fence") return this.paintLights(el, a);
      const pos = (DECO_SLOT_FIX[a.id] && DECO_SLOT_FIX[a.id][item.slot]) || DECO_SLOTS[item.slot];
      const v = this.decoVariant(item, a.id);
      el.appendChild(Pix.elVar(v.name, v.map, v.outline, "deco deco-" + item.id + (item.id === "ghost" ? " g-" + a.id : ""), pos[0], pos[1], 64, 44));
    });
  },
  /* Lichterkette am Zaun: zwei Lampen-Gruppen blinken abwechselnd */
  paintLights(el, a) {
    const i = Math.max(0, ANIMALS.findIndex(x => x.id === a.id));
    const spots = [];
    for (let x = 3; x <= 60; x += 3) spots.push([x, 3 + (x % 6 === 0 ? 1 : 0)]);
    for (let x = 3; x <= 24; x += 3) spots.push([x, 38]);
    for (let x = 39; x <= 60; x += 3) spots.push([x, 38]);
    const wire = document.createElement("canvas"); wire.width = 64; wire.height = 44; wire.className = "bg";
    const gw = wire.getContext("2d"); gw.fillStyle = "#2f5a2a";
    spots.forEach(([x, y], k) => { const nx = spots[k + 1]; if (nx && nx[1] === y || (nx && Math.abs(nx[1] - y) === 1)) { if (nx[0] > x) gw.fillRect(x, y, nx[0] - x, 1); } });
    el.appendChild(wire);
    [0, 1].forEach(grp => {
      const c = document.createElement("canvas"); c.width = 64; c.height = 44; c.className = "bg lights l" + grp;
      const g = c.getContext("2d");
      spots.forEach(([x, y], k) => { if (k % 2 !== grp) return; g.fillStyle = DECO_COLORS[(k + i) % DECO_COLORS.length]; g.fillRect(x, y, 1, 2); });
      el.appendChild(c);
    });
  },
  /* Gratis-Wetter der Jahreszeit */
  paintWeather(el, big) {
    const w = this.season().weather; if (!w) return;
    const cols = { leaves: ["#d9822b", "#c0392b", "#e8b04a", "#8a5a32"], snow: ["#ffffff"], petals: ["#ffb3c8", "#ffffff", "#ffd6e5"],
      sparkles: ["#fff2a8", "#ffffff"], fluff: ["#ffffff", "#f3f3f3"] }[w];
    const box = document.createElement("div"); box.className = "weather w-" + w;
    for (let i = 0; i < (big ? 14 : 7); i++) {
      const p = document.createElement("i");
      p.style.left = (Math.random() * 96).toFixed(1) + "%"; p.style.top = (w === "fluff" ? 10 + Math.random() * 70 : -8) + "%";
      p.style.animationDuration = (3 + Math.random() * 3).toFixed(2) + "s"; p.style.animationDelay = (-Math.random() * 6).toFixed(2) + "s";
      p.style.background = U.pick(cols);
      box.appendChild(p);
    }
    el.appendChild(box);
  },
  decoCard() {
    const s = this.season(), items = this.seasonDecos(), A = this.A, n = A.unlocked.length;
    if (!items.length) return `<section class="card"><div class="card-title">🎨 ${s.name}-Deko</div><p class="small">Die Deko für diese Jahreszeit kommt bald.</p></section>`;
    return `<section class="card"><div class="card-title title-row">🎨 ${s.name}-Deko <span class="pill gold">⭐ ${A.wallet} XP</span></div>
      <p class="small">Schmück deine Gehege! Jedes Teil kaufst du für ein Gehege. Es bleibt bis ${s.until} stehen und kommt nächstes Jahr wieder.</p>
      ${items.map(it => { const have = A.unlocked.filter(id => this.hasDeco(it.id, id)).length;
        return `<div class="food-row"><span class="food-ico" data-decoico="${it.id}"></span>
          <div class="food-txt"><b>${it.name}</b><span>${have} von ${n} Gehegen</span></div>
          <button class="buy" data-deco="${it.id}" ${have < n && A.wallet >= it.price ? "" : "disabled"}>${have < n ? "⭐ " + it.price : "✓"}</button></div>`; }).join("")}
    </section>`;
  },
  buyDecoDialog(id) {
    const it = DECOS.find(d => d.id === id), A = this.A;
    this.dialog(`<p class="dlg-title">🎨 ${it.name}</p><p class="dlg-en">${it.en}</p><p>Für welches Gehege? Jedes bekommt seine eigene Farbe.</p>
      ${A.unlocked.map(aid => { const a = this.animal(aid), has = this.hasDeco(id, aid);
        return `<div class="food-row"><span class="food-ico" data-decoprev="${aid}"></span>
          <div class="food-txt"><b>${a.geh}-Gehege</b><span>${has ? "✓ schon geschmückt" : ""}</span></div>
          ${has ? `<span class="have">✓</span>` : `<button class="buy" data-decobuy="${aid}" ${A.wallet >= it.price ? "" : "disabled"}>⭐ ${it.price}</button>`}</div>`; }).join("")}
      ${A.wallet < it.price ? `<p class="small">Zu wenig XP? Löse im Shop neue Wörter!</p>` : ""}
      <button class="btn ghost bi-btn" data-close><span>Schließen</span><em class="en">Close</em></button>`,
      d => {
        d.querySelectorAll("[data-decoprev]").forEach(el => el.appendChild(this.decoIcon(it, el.dataset.decoprev)));
        d.querySelectorAll("[data-decobuy]").forEach(b => b.onclick = () => this.buyDeco(id, b.dataset.decobuy));
      });
  },
  buyDeco(id, aid) {
    const it = DECOS.find(d => d.id === id), A = this.A;
    if (A.wallet < it.price || this.hasDeco(id, aid)) return;
    A.wallet -= it.price; A.decos[id] = (A.decos[id] || []).concat(aid); Store.save(); this.bump("decos");
    Sound.play("coin"); Confetti.burst(80, "stars");
    const a = this.animal(aid);
    this.dialog(`<p class="dlg-title">🎨 Geschmückt!</p><div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p>${it.name}: jetzt im ${a.geh}-Gehege.</p><p class="dlg-en">The ${it.en} is now in the ${a.en} enclosure.</p>
      <button class="btn primary big" data-close>Super!</button>`,
      d => { this.scene(d.querySelector("[data-bigscene]"), a, true); d.dataset.rerender = "1"; });
  },

  /* Mio-Joker: zählt nur die insgesamt verdienten XP im Hintergrund */
  checkJokers() {
    const A = this.A, earned = Math.floor((Store.data.xp || 0) / JOKER_XP);
    if (earned > A.jokerAwarded) { const n = earned - A.jokerAwarded; A.jokers += n; A.jokerNew += n; A.jokerAwarded = earned; Store.save(); }
  },
  nextJoker() { return JOKER_XP - ((Store.data.xp || 0) % JOKER_XP); },
  jokerPopup() {
    this.A.jokerNew = 0; Store.save();
    Sound.play("finish"); Confetti.burst(120, "stars");
    this.dialog(`<div class="joker-pic"><div class="joker-mio">${Mio.svg("cheer")}</div><span data-broom></span></div>
      <p class="dlg-title">🧹 Mio hilft!</p><p class="dlg-en">Mio helps!</p>
      <p>Du hast insgesamt ${this.A.jokerAwarded * JOKER_XP} XP gesammelt. Dafür bekommst du einen <b>Joker</b>: Mio putzt ein Gehege für dich.</p>
      <p class="small"><em class="en-inline">You get a joker: Mio cleans one enclosure for you.</em></p>
      <p class="small">Du hast jetzt ${this.A.jokers} Joker. Tipp auf ein schmutziges Gehege und dann auf „Mio hilft“.</p>
      <button class="btn primary big" data-close>Super!</button>`,
      d => { d.dataset.rerender = "1"; const b = Pix.icon("broom"); b.className = "joker-broom"; d.querySelector("[data-broom]").appendChild(b); });
  },
  useJoker(a, d) {
    const A = this.A;
    if (!(A.jokers > 0) || this.dirt(a.id) === 0 || this.sad(a.id)) return;
    // sofort speichern, die Animation ist nur Anzeige
    // Mio schenkt genau die XP, die das Putzen gebracht hätte (1 oder 5 pro Aufgabe)
    const gift = ZOO.CLEAN_TASKS * (this.hasFriend(a.id) ? ENC_XP_TWO.correct : ENC_XP_ONE.correct);
    A.jokers--; A.animals[a.id].clean = U.today(); Store.save(); this.bump("jokersUsed");
    Plan.addXP(gift); this.checkZoo();
    d.dataset.rerender = "1";
    const sc = d.querySelector("[data-bigscene]"), row = d.querySelector("[data-cleanrow]");
    row.innerHTML = `<div class="row-txt">🧹 ${this.bi("Mio putzt …", "Mio is cleaning …")}</div>`;
    const dirt = sc.querySelector("canvas.dirt"); if (dirt) dirt.classList.add("sweep");
    const run = document.createElement("div"); run.className = "mio-run";
    run.innerHTML = Mio.svg("cheer");
    const br = Pix.icon("broom"); br.className = "run-broom"; run.appendChild(br);
    sc.appendChild(run);
    Sound.play("sweep");
    run.addEventListener("animationend", e => {
      if (e.target !== run || !sc.isConnected) return;
      run.remove();
      this.scene(sc, a, true); this.hearts(sc, 5);
      Sound.play("combo"); Confetti.burst(60, "stars");
      row.innerHTML = `<div class="row-txt">🧹 ${this.bi(`Sauber ✨ – danke, Mio! Mio schenkt dir ${gift} XP.`, `Clean – thank you, Mio! Mio gives you ${gift} XP.`)}</div>`;
      this.toyRow(a, d);
    });
  },
  checkTrophies() {
    const A = this.A, t = U.today();
    let changed = false;
    TROPHIES.forEach(tr => {
      if (A.trophies[tr.id]) return;
      let ok = false; try { ok = tr.test(this); } catch (e) { ok = false; }
      if (ok) { A.trophies[tr.id] = t; A.trophyQueue.push(tr.id); changed = true; }
    });
    if (changed) Store.save();
  },
  trophyEl(tr, locked, size) { const c = Pix.trophy(tr.shape, tr.metal, locked); c.style.width = size || "56px"; return c; },
  dayText(d) { return new Date(d * 864e5).toLocaleDateString("de-DE", { timeZone: "UTC", day: "numeric", month: "long", year: "numeric" }); },
  trophyPopup() {
    const id = this.A.trophyQueue.shift(); Store.save();
    const tr = TROPHIES.find(x => x.id === id); if (!tr) return;
    Sound.play("finish"); Confetti.burst(170);
    this.dialog(`<p class="dlg-title">🏆 Neuer Pokal!</p><div class="tro-big" data-trobig></div>
      <p class="tro-name">${U.esc(tr.name)}</p><p>${U.esc(tr.desc)}</p>
      <button class="btn primary big" data-close>Super!</button><button class="btn ghost" data-togallery>Alle Pokale ansehen</button>`,
      d => { d.dataset.rerender = "1"; d.querySelector("[data-trobig]").appendChild(this.trophyEl(tr, false, "120px"));
        d.querySelector("[data-togallery]").onclick = () => { d.hidden = true; this.view = "trophies"; this.render(); }; });
  },
  trophiesView() {
    const A = this.A, got = TROPHIES.filter(t => A.trophies[t.id]).length;
    return `<header class="top"><div class="brand">Deine Pokale</div><div class="pill gold">⭐ ${A.wallet} XP</div>
      <button class="icon" data-go="settings" aria-label="Einstellungen">⚙️</button></header>
      <div class="card tro-head"><b>🏆 ${got} von ${TROPHIES.length} Pokalen</b>
        <div class="progress"><div style="width:${Math.round(100 * got / TROPHIES.length)}%"></div></div></div>
      <div class="tro-grid">${TROPHIES.map(t => `<button class="tro ${A.trophies[t.id] ? "got" : "locked"}" data-trophy="${t.id}">
        <span class="tro-ico" data-troico="${t.id}"></span><span class="tro-label">${A.trophies[t.id] ? U.esc(t.name) : "?"}</span></button>`).join("")}</div>`;
  },
  openTrophy(id) {
    const tr = TROPHIES.find(x => x.id === id), day = this.A.trophies[id];
    this.dialog(`<div class="tro-big" data-trobig></div>
      <p class="tro-name">${day ? U.esc(tr.name) : "Noch nicht geschafft"}</p>
      <p>${U.esc(tr.desc)}</p>${day ? `<p class="small">Geschafft am ${this.dayText(day)}</p>` : `<p class="small">Schaffst du das? 💪</p>`}
      <button class="btn primary big" data-close>OK</button>`,
      d => d.querySelector("[data-trobig]").appendChild(this.trophyEl(tr, !day, "120px")));
  },

  /* Traurig: einen ganzen Tag nicht gefüttert oder nicht sauber gemacht – muss erst getröstet werden */
  sad(id) { return (this.hunger(id) >= 2 || this.dirt(id) >= 2) && this.A.animals[id].comforted !== U.today(); },
  /* Nach langer Pause (Ferien) hat Mio auf die Tiere aufgepasst: niemand weint */
  checkHoliday() {
    const A = this.A, t = U.today();
    if (A.lastVisit != null && t - A.lastVisit >= ZOO.HOLIDAY_DAYS) {
      A.unlocked.forEach(id => { A.animals[id].fed = t - 1; A.animals[id].clean = t - 1; });
      A.event = null; A.lastEventRoll = t;
      this.holidayMsg = true;
    }
    A.lastVisit = t; Store.save();
  },
  /* Herzen: ❤️ = gefüttert + sauber (+ kein Ereignis), 💖 = dazu heute gespielt */
  heart1(id) { const ev = this.A.event; return this.hunger(id) === 0 && this.dirt(id) === 0 && !(ev && ev.animal === id); },
  heart2(id) { return this.heart1(id) && this.A.animals[id].toy === U.today(); },
  played(id) { return this.A.animals[id].toy === U.today(); },
  zooLevel() {
    const ids = this.A.unlocked;
    if (!ids.length) return 0;
    if (ids.every(id => this.heart2(id))) return 2;
    if (ids.every(id => this.heart1(id))) return 1;
    return 0;
  },
  /* nach jeder Aktion: Ist der Zoo heute glücklich / superglücklich geworden? */
  checkZoo() {
    const A = this.A, t = U.today(), lvl = this.zooLevel(), prev = A.days[t] || 0;
    if (lvl > prev) {
      A.days[t] = lvl;
      if (prev < 1) Plan.addXP(ZOO.HAPPY_BONUS);
      if (lvl === 2) Plan.addXP(ZOO.POWER_BONUS);
      this.pendingZoo = lvl;
      Object.keys(A.days).forEach(d => { if (+d < t - 90) delete A.days[d]; });
      Store.save();
    }
  },
  zooStreak(level) {
    const A = this.A, t = U.today();
    let d = (A.days[t] || 0) >= level ? t : t - 1, n = 0;
    while ((A.days[d] || 0) >= level) { n++; d--; }
    return n;
  },
  rollEvent() {
    const A = this.A, t = U.today();
    if (A.lastEventRoll === t) return;
    A.lastEventRoll = t;
    if (!A.event && Plan.learnedWords().length >= ZOO.EVENT_MIN_WORDS && Math.random() < ZOO.EVENT_CHANCE) this.makeEvent();
    Store.save();
  },
  makeEvent() {
    const A = this.A;
    const animal = U.pick(A.unlocked), keys = Object.keys(EVENTS);
    const own = keys.filter(k => EVENTS[k].only === animal), gen = keys.filter(k => !EVENTS[k].only);
    A.event = { type: own.length && Math.random() < 0.6 ? U.pick(own) : U.pick(gen), animal, day: U.today() };
    Store.save();
  },
  foodNeeded() { return new Set(this.A.unlocked.map(id => this.animal(id).food)); },

  hint() {
    const A = this.A;
    const sadId = A.unlocked.find(id => this.sad(id));
    if (sadId) { const a = this.animal(sadId); return { mood: "encourage", en: "Oh no, someone is sad!", de: `${a.der} ist traurig und weint. Tipp auf das Gehege und tröste ${a.sie}.` }; }
    if (A.event) { const a = this.animal(A.event.animal); return { mood: "encourage", en: "Oh no!", de: `${EVENTS[A.event.type].title} (${a.geh}-Gehege) Hilf mit!` }; }
    const hungry = A.unlocked.filter(id => this.hunger(id) > 0);
    const canFeed = hungry.find(id => A.inv[this.animal(id).food] > 0);
    if (canFeed) { const a = this.animal(canFeed); return { mood: "idle", en: "Feeding time!", de: `${a.der} hat Hunger. Du hast ${FOODS[a.food].name} – tipp auf das Gehege!` }; }
    if (hungry.length) { const a = this.animal(hungry[0]); return { mood: "idle", en: "Let's go shopping!", de: `${a.der} hat Hunger. Löse im Shop Aufgaben und kauf ${FOODS[a.food].name}.` }; }
    const dirty = A.unlocked.find(id => this.dirt(id) > 0);
    if (dirty) return { mood: "idle", en: "Time to clean up!", de: `Das ${this.animal(dirty).geh}-Gehege ist schmutzig. Beim Putzen wiederholst du Wörter.` };
    const noToy = A.unlocked.filter(id => !this.played(id));
    if (noToy.length) { const a = this.animal(noToy[0]);
      return { mood: "cheer", en: "Happy zoo! Go for power?", de: `Alle Tiere sind glücklich ❤️. Erspiel am Gehege jedem Tier sein Spielzeug für den Power-Zoo 💖 – zum Beispiel ${TOYS[a.id].name} für ${a.fuer}.` }; }
    return { mood: "party", en: "POWER ZOO!", de: Plan.nextPack(A.setId) ? "Im Shop warten neue Wörter auf dich." : "Super gemacht! Schau morgen wieder vorbei." };
  },

  /* ---------- Darstellung ---------- */
  header() {
    return `<header class="top">
      <div class="brand">Mios Zoo</div>
      <div class="pill gold" title="XP zum Einkaufen">⭐ ${this.A.wallet} XP</div>
      <div class="pill fire">🔥 ${Plan.streak()}</div>
      <button class="icon" data-go="settings" aria-label="Einstellungen">⚙️</button>
    </header>`;
  },
  nav() {
    return `<nav class="bottom-nav"><button class="${this.view === "zoo" ? "on" : ""}" data-go="zoo">🦒 Zoo</button>
      <button class="${this.view === "shop" ? "on" : ""}" data-go="shop">🏪 Shop</button>
      <button class="${this.view === "trophies" ? "on" : ""}" data-go="trophies">🏆 Pokale</button></nav>`;
  },
  invBar() {
    const A = this.A, need = this.foodNeeded();
    return `<div class="inv">${Object.keys(FOODS).map(f => `<div class="inv-item ${need.has(f) ? "" : "dim"}"><span data-icon="${f}"></span> ${A.inv[f]}</div>`).join("")}
      <span class="inv-label">Vorrat</span></div>`;
  },

  render(keep) {
    this.checkJokers();
    this.checkTrophies();
    const app = document.getElementById("app");
    const y = window.scrollY;
    if (this.view === "zoo") app.innerHTML = this.zooView();
    else if (this.view === "shop") app.innerHTML = this.shopView();
    else if (this.view === "trophies") app.innerHTML = this.trophiesView();
    else app.innerHTML = this.settingsView();
    app.insertAdjacentHTML("beforeend", this.nav() + `<div class="dialog" hidden></div>`);
    this.paint(app);
    this.bind(app);
    window.scrollTo(0, keep ? y : 0);
    if (this.quiet) return;
    if (this.view !== "settings" && this.holidayMsg) {
      this.holidayMsg = false;
      this.dialog(`<div class="party-mio">${Mio.svg("cheer")}</div><p class="dlg-title">Welcome back!</p>
        <p>Mio hat auf die Tiere aufgepasst, während du weg warst. Jetzt haben sie ein bisschen Hunger.</p>
        <button class="btn primary big" data-close>Los geht's!</button>`, d => { d.dataset.rerender = "1"; });
    } else if (this.view !== "settings" && this.A.welcome.length) this.welcomeAnimal();
    else if (this.view !== "settings" && (this.A.friendWelcome || []).length) this.friendPopup();
    else if (this.pendingZoo) this.zooParty();
    else if (this.view !== "settings" && this.A.jokerNew > 0) this.jokerPopup();
    else if (this.view !== "settings" && this.A.trophyQueue.length) this.trophyPopup();
  },

  zooView() {
    const h = this.hint();
    return `${this.header()}
      ${TEST_MODE ? `<div class="test-banner">🧪 Testversion mit Testwörtern</div>` : ""}
      <div class="hero"><div class="hero-mio">${Mio.svg(h.mood)}</div>
        <div class="bubble"><b>${U.esc(h.en)}</b><br>${U.esc(h.de)}</div></div>
      ${this.invBar()}
      ${this.statusCard()}
      <div class="zoo-grid">${ANIMALS.map(a => this.A.unlocked.includes(a.id) ? this.encCard(a) : this.lockedCard()).join("")}</div>`;
  },
  statusCard() {
    const ids = this.A.unlocked, n1 = ids.filter(id => this.heart1(id)).length, n2 = ids.filter(id => this.heart2(id)).length;
    return `<div class="zoo-status">
      <div class="zs-row"><span class="zs-name">❤️ Glücklicher Zoo</span><b>${n1}/${ids.length}</b><span class="zs-streak" title="Serie">🔥 ${this.zooStreak(1)}</span></div>
      <div class="zs-row"><span class="zs-name">💖 Power-Zoo</span><b>${n2}/${ids.length}</b><span class="zs-streak" title="Power-Serie">⚡ ${this.zooStreak(2)}</span></div>
      <div class="zs-row"><span class="zs-name">🦊 Mio-Joker</span><b>${this.A.jokers}</b><span class="zs-next">nächster in ${this.nextJoker()} XP</span></div>
      <div class="zs-help">❤️ = gefüttert und sauber · 💖 = dazu Spielzeug erspielt · 🦊 = Mio putzt ein Gehege</div></div>`;
  },
  encCard(a) {
    const hu = this.hunger(a.id), di = this.dirt(a.id), ev = this.A.event && this.A.event.animal === a.id;
    const icons = this.sad(a.id) ? "😢" : (this.heart1(a.id) ? "❤️" : "🤍") + (this.heart2(a.id) ? "💖" : "🤍");
    return `<button class="enc ${ev ? "alert" : ""}" data-enc="${a.id}"><div class="scene" data-scene="${a.id}"></div>
      <div class="enc-name"><span>${a.name}</span><span class="enc-ico">${icons}</span></div></button>`;
  },
  lockedCard() {
    return `<div class="enc locked"><div class="scene locked-scene"><span>🔒</span></div>
      <div class="enc-name"><span>Bald neu</span></div></div>`;
  },

  /* Szene in einen Container zeichnen */
  scene(el, a, big, opts) {
    opts = opts || {};
    el.innerHTML = "";
    const bg = document.createElement("canvas"); bg.className = "bg"; Scene.draw(bg, a, { perch2: a.id === "owl" && this.hasFriend("owl"), look: this.look() }); el.appendChild(bg);
    const evNow = this.A.event && this.A.event.animal === a.id ? EVENTS[this.A.event.type] : null;
    if (evNow && evNow.overlay) { const ov = document.createElement("canvas"); ov.className = "bg"; Scene.eventOverlay(ov, evNow.overlay, a); el.appendChild(ov); }
    const F = FRIENDS[a.id], friend = this.hasFriend(a.id);
    const mainPos = evNow && evNow.animalPos ? evNow.animalPos : a.pos;
    const dirt = document.createElement("canvas"); dirt.className = "bg dirt"; Scene.dirt(dirt, a, this.dirt(a.id)); el.appendChild(dirt);
    const hu = this.hunger(a.id);
    const mood = hu >= 2 ? "hungry" : hu === 1 ? "peckish" : "happy";
    const toy = TOYS[a.id];
    // Spielzeug, das heute im Gehege liegt (Ball, Wollknäuel, Eisrutsche)
    // die Eisrutsche steht fest im Gehege; Ball und Wollknäuel liegen in der Routine mit drin
    if (toy.fixed && (this.played(a.id) || opts.play))
      el.appendChild(Pix.el(toy.sprite, "toy", toy.rest[0], toy.rest[1], 64, 44));
    this.paintDeco(el, a);
    if (this.sad(a.id) && !opts.play) {
      // traurig: sitzt da und weint
      const spots = [mainPos].concat(friend ? [F.pos] : []);
      spots.forEach((p, i) => {
        el.appendChild(Pix.el(a.id, "animal sad", p[0], p[1], 64, 44, i === 1));
        const ex = i === 1 ? Pix.size(a.id).w - 1 - a.eye[0] : a.eye[0];
        [0, 1].forEach(k => el.appendChild(Pix.el("tear", "tear t" + k, p[0] + ex - 1, p[1] + a.eye[1] + 1, 64, 44)));
      });
      const b = document.createElement("div"); b.className = "need";
      b.style.left = (100 * (a.pos[0] + 8) / 64) + "%"; b.style.top = (100 * Math.max(0, a.pos[1] - 9) / 44) + "%";
      b.appendChild(Pix.icon("sadheart")); el.appendChild(b);
    } else if (opts.play) {
      // einmaliges Spiel mit dem Spielzeug
      Routine.mount(el, "play_" + a.id, PLAYS[a.id], { once: true, onEnd: opts.onEnd, sound: true });
      if (friend) Routine.mount(el, a.id + "_friend", this.friendRoutine(a.id), F.delay ? { delay: F.delay } : {});
    } else if (hu === 0 && ROUTINES[a.id] && !evNow) {
      // satt: das Tier spielt (rutschen, tauchen, fliegen …) – mit Spielzeug auch immer wieder damit
      const withToy = this.played(a.id);
      const key = withToy ? a.id + "_toy" : a.id, segs = withToy ? this.toyRoutine(a.id) : ROUTINES[a.id];
      Routine.mount(el, key, segs, { sound: true });
      // das zweite Tier macht seine eigene Runde (das Spielzeug gehört beiden)
      if (friend) Routine.mount(el, a.id + "_friend", this.friendRoutine(a.id), F.delay ? { delay: F.delay } : {});
    } else {
      el.appendChild(Pix.el(a.id, "animal " + mood, mainPos[0], mainPos[1], 64, 44));
      if (friend) el.appendChild(Pix.el(a.id, "animal twin " + mood, F.pos[0], F.pos[1], 64, 44, true));
    }
    if (hu > 0 && !this.sad(a.id)) {
      const b = document.createElement("div"); b.className = "need";
      b.style.left = (100 * (a.pos[0] + 8) / 64) + "%"; b.style.top = (100 * Math.max(0, a.pos[1] - 9) / 44) + "%";
      b.appendChild(Pix.icon(a.food)); el.appendChild(b);
    }
    const ev = this.A.event;
    if (ev && ev.animal === a.id && EVENTS[ev.type].sprite) {
      const E = EVENTS[ev.type];
      el.appendChild(Pix.el(E.sprite, "event", E.pos[0], E.pos[1], 64, 44));
    }
    this.paintWeather(el, big);
    if (big) { const hz = document.createElement("div"); hz.className = "hearts"; el.appendChild(hz); }
  },
  /* Tagesroutine + Spiel mit dem Spielzeug (solange es heute da ist) */
  toyRoutine(id) {
    const toy = TOYS[id], base = ROUTINES[id];
    const play = PLAYS[id].map(x => Object.assign({}, x));
    const lying = toy.rest && !toy.fixed ? { f: toy.sprite, id: "toyrest", a: toy.rest } : null;
    if (lying) {
      // beim Nochmal-Spielen startet das Spielzeug dort, wo es liegt
      const f0 = play[0], fx = [].concat(f0.fx || []).map(x => x.f === toy.sprite ? Object.assign({}, x, { a: toy.rest }) : x);
      play[0] = Object.assign({}, f0, { fx });
    }
    const segs = base.map(x => lying ? Object.assign({}, x, { fx: [].concat(x.fx || [], [lying]) }) : x);
    // Laufweg vom Ende der Routine zum Start des Spiels
    const last = segs[segs.length - 1], end = last.b || last.a, start = play[0].a;
    if (play[0].f === id && (end[0] !== start[0] || end[1] !== start[1])) {
      const right = start[0] > end[0], facesRight = id === "seal";
      segs.push(Object.assign({ f: id, a: end, b: start, t: 1.2, flip: right ? !facesRight : facesRight }, lying ? { fx: [lying] } : {}));
    }
    return segs.concat(play);
  },

  paint(root) {
    root.querySelectorAll("[data-decoico]").forEach(el => el.appendChild(this.decoIcon(DECOS.find(d => d.id === el.dataset.decoico), "penguin")));
    root.querySelectorAll("[data-troico]").forEach(el => { const tr = TROPHIES.find(x => x.id === el.dataset.troico); el.appendChild(this.trophyEl(tr, !this.A.trophies[tr.id])); });
    root.querySelectorAll("[data-scene]").forEach(el => this.scene(el, this.animal(el.dataset.scene)));
    root.querySelectorAll("[data-icon]").forEach(el => { el.innerHTML = ""; el.appendChild(Pix.icon(el.dataset.icon)); });
    const stall = root.querySelector("canvas.stall"); if (stall) this.drawStall(stall);
  },

  drawStall(c) {
    c.width = 64; c.height = 30; const g = c.getContext("2d");
    const f = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    f(0, 0, 64, 30, "#b07a42");
    for (let y = 9; y < 30; y += 4) { f(0, y, 64, 1, "#8b5a2b"); }
    for (let x = 0; x < 64; x += 8) { f(x, 0, 4, 8, "#d94848"); f(x + 4, 0, 4, 8, "#f7ead0"); }
    for (let x = 0; x < 64; x += 4) { f(x + 1, 8, 2, 1, (x / 4) % 2 ? "#f7ead0" : "#d94848"); }
    f(0, 8, 64, 0.5, "#9e2f2f");
    f(0, 21, 64, 9, "#7a4b2a"); f(0, 21, 64, 1, "#c08a4e"); f(0, 29, 64, 1, "#5e3a1a");
    [["fish", 6, 14], ["meat", 26, 12], ["feed", 46, 9]].forEach(([n, x, y]) => {
      f(x - 2, 19, 16, 3, "#8b5a2b"); f(x - 2, 19, 16, 1, "#c08a4e"); g.drawImage(Pix.canvas(n), x, y + (n === "fish" ? 3 : 0));
    });
  },

  /* Wiederholungs-Runden im Shop (pro Unit und Tag) */
  reviewRecent(setId) { const i = Data.sets.findIndex(x => x.id === setId); return i >= Data.sets.length - 2; },
  reviewRounds(setId) {
    const A = this.A, t = U.today();
    if (!A.revRounds || A.revRounds.day !== t) A.revRounds = { day: t, n: {} };
    return A.revRounds.n[setId] || 0;
  },
  reviewXP(setId) {
    const list = REVIEW_XP[this.reviewRecent(setId) ? "recent" : "old"];
    return list[Math.min(this.reviewRounds(setId), list.length - 1)];
  },
  shopPractice() {
    const setId = this.A.setId, xp = this.reviewXP(setId);
    this.A.revRounds.n[setId] = this.reviewRounds(setId) + 1; Store.save();
    const { label, en, ...vals } = xp;
    this.practice(8, "Great work!", () => {}, vals, null, setId);
  },

        <span class="pk-ico">${k.done ? "✅" : k.unlocked ? "📦" : "🔒"}</span>
        <span class="pk-name">${U.esc(k.label)}</span><span class="pk-n">${k.learned}/${k.words.length}</span></div>`).join("")}

      <div class="row" data-toyrow></div>
      ${this.seasonDecos().length ? (() => { const s = this.season(), items = this.seasonDecos(), c = items.filter(it => this.hasDeco(it.id, id)).length;
        return `<div class="row"><div class="row-txt">🎨 ${this.bi(`${s.name}-Deko: ${c} von ${items.length}`, `${s.en[0].toUpperCase() + s.en.slice(1)} decorations: ${c} of ${items.length}`)}</div>
          ${c < items.length ? this.bbtn("data-todeco", "Im Shop schmücken", "Decorate in the shop", "") : ""}</div>`; })() : ""}
      <button class="btn ghost bi-btn" data-close><span>Schließen</span><em class="en">Close</em></button>`);
    this.toyRow(a, d);
    const sc = d.querySelector("[data-bigscene]");
    this.scene(sc, a, true);
    d.querySelectorAll(".row-txt [data-icon]").forEach(el => el.appendChild(Pix.icon(el.dataset.icon)));
    const fb = d.querySelector("[data-feed]");
    if (fb) fb.onclick = () => this.feed(a, d);
    const ts = d.querySelector(".row:not([data-toyrow]) [data-toshop]");
    if (ts) ts.onclick = () => { d.hidden = true; this.view = "shop"; this.render(); };
    const td = d.querySelector("[data-todeco]");
    if (td) td.onclick = () => { d.hidden = true; this.view = "shop"; this.render(); const c = document.querySelectorAll(".card"); if (c.length) c[c.length - 1].scrollIntoView(); };
    const jb = d.querySelector("[data-joker]");
    if (jb) jb.onclick = () => this.useJoker(a, d);
    const cb = d.querySelector("[data-clean]");
    if (cb) cb.onclick = () => { d.hidden = true; this.afterMsg = () => this.celebrate(a, "Sparkling clean!", "Das Gehege glänzt wieder."); this.practice(ZOO.CLEAN_TASKS, "Sparkling clean!", () => { A.animals[id].clean = U.today(); Store.save(); this.checkZoo(); }, false, id); };
    const cf = d.querySelector("[data-comfort]");
    if (cf) cf.onclick = () => { d.hidden = true;
      this.afterMsg = () => this.celebrate(a, "Feeling better!", `${a.der} ist wieder froh. Jetzt füttern und sauber machen!`);
      this.practice(ZOO.COMFORT_TASKS, "Feeling better!", () => { A.animals[id].comforted = U.today(); Store.save(); }, false, id); };
    const eb = d.querySelector("[data-event]");
    if (eb) eb.onclick = () => { d.hidden = true; const E = EVENTS[ev.type];
      this.afterMsg = () => this.celebrate(a, "Problem solved!", `${E.done} Bonus: +${ZOO.EVENT_BONUS} XP`);
      this.practice(ZOO.EVENT_TASKS, "Problem solved!", () => { A.event = null; Store.save(); this.bump("events"); Plan.addXP(ZOO.EVENT_BONUS); this.checkZoo(); }, false, id); };
  },

  feed(a, d) {
    const A = this.A, x = A.animals[a.id], t = U.today();
    if (!(A.inv[a.food] > 0)) return;
    A.inv[a.food]--;
    // bei zwei Tieren: erst nach der zweiten Portion sind beide satt
    const n = (x.part && x.part.day === t ? x.part.n : 0) + 1;
    x.part = { day: t, n };
    if (n < this.portions(a.id)) {
      Store.save(); this.bump("fed");
      Sound.play("coin");
      this.openEnc(a.id);
      const d2 = document.querySelector(".dialog"); d2.dataset.rerender = "1";
      this.hearts(d2.querySelector("[data-bigscene]"), 3);
      return;
    }
    x.fed = t; Store.save(); this.bump("fed");
    Sound.play("finish"); Confetti.burst(60);
    const sc = d.querySelector("[data-bigscene]");
    this.scene(sc, a, true);
    this.hearts(sc, 6);
    this.checkZoo();
    d.dataset.rerender = "1";
    this.toyRow(a, d);
    const fb = d.querySelector("[data-feed]");
    fb.outerHTML = `<div class="yum"><div class="yum-mio">${Mio.svg("cheer")}</div><div class="bubble">Yummy! ${this.hasFriend(a.id) ? "Jetzt sind beide satt." : a.der + " ist jetzt satt."}</div></div>`;
    d.querySelector(".row-txt").innerHTML = `<span class="px-wrap"></span> ${this.hasFriend(a.id)
      ? this.bi("Beide " + FRIENDS[a.id].plural + " sind satt und glücklich 😊", "Both " + a.enPl + " are full and happy.")
      : this.bi(a.der + " ist satt und glücklich 😊", this.enName(a) + " is full and happy.")}`;
    d.querySelector(".px-wrap").appendChild(Pix.icon(a.food));
  },

  hearts(sc, n, big) {
    const hz = sc.querySelector(".hearts"); if (!hz) return;
    for (let i = 0; i < n; i++) {
      const h = Pix.icon("heart"); h.className = "px-icon heart" + (big ? " big" : "");
      h.style.left = (20 + Math.random() * 60) + "%"; h.style.animationDelay = (i * 0.12) + "s"; hz.appendChild(h);
    }
  },

  /* Spielzeug-Zeile im Gehege-Fenster */
  toyRow(a, d) {
    const A = this.A, id = a.id, toy = TOYS[id], row = d.querySelector("[data-toyrow]");
    if (!row) return;
    const hu = this.hunger(id), ev = A.event && A.event.animal === id ? A.event : null;
    const two = this.hasFriend(id);
    row.innerHTML = `<div class="row-txt"><span class="px-wrap"></span> ${this.played(id)
        ? this.bi(`${two ? "Beide " + FRIENDS[id].plural + " haben" : a.der + " hat"} heute schon gespielt 💖`, `${two ? "Both " + a.enPl + " have" : this.enName(a) + " has"} already played today.`)
        : this.bi(`Spielzeug: ${toy.name}`, `Toy: ${toy.en}`)}</div>
      ${this.played(id) ? "" : this.sad(id) ? `<p class="small">${this.bi("Erst trösten.", "Comfort first.")}</p>`
        : ev ? `<p class="small">${this.bi(`Zuerst: ${EVENTS[ev.type].action}.`, `First: ${EVENTS[ev.type].enAction.toLowerCase()}.`)}</p>`
        : hu > 0 || this.dirt(id) > 0 ? `<p class="small">${this.bi("Erst füttern und sauber machen, dann spielen.", "First feed and clean, then play.")}</p>`
        : this.bbtn("data-toy", `🎁 ${toy.name} erspielen · ${ZOO.TOY_TASKS} Aufgaben`, `Win the ${toy.en} · ${ZOO.TOY_TASKS} tasks`)}`;
    row.querySelector(".px-wrap").appendChild(Pix.icon(toy.sprite));
    const tb = row.querySelector("[data-toy]");
    if (tb) tb.onclick = () => {
      d.hidden = true;
      this.afterMsg = () => this.playDialog(a);
      this.practice(ZOO.TOY_TASKS, "Toy unlocked!", () => { A.animals[id].toy = U.today(); Store.save(); this.bump("toys"); this.checkZoo(); }, false, id);
    };
  },

  /* Spielzeug wurde am Gehege erspielt: jetzt wird gespielt */
  playDialog(a) {
    const toy = TOYS[a.id];
    const d = this.dialog(`<div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p class="dlg-title">🎁 ${U.esc(toy.name)}!</p>
      <div class="row" data-playrow><div class="row-txt">${this.bi(`${a.der} spielt …`, `${this.enName(a)} is playing …`)}</div></div>
      <button class="btn primary big" data-close>Super!</button>`, dd => { dd.dataset.rerender = "1"; });
    const sc = d.querySelector("[data-bigscene]"), row = d.querySelector("[data-playrow]");
    Sound.play("coin");
    this.scene(sc, a, true, { play: true, onEnd: () => {
      if (!sc.isConnected) return;
      this.scene(sc, a, true);
      this.hearts(sc, 8, true);
      Sound.play("finish"); Confetti.burst(90);
      row.innerHTML = `<div class="row-txt"><span class="px-wrap"></span> ${this.bi(`${a.der} ist superglücklich 💖`, `${this.enName(a)} is super happy!`)}</div>
        <div class="yum"><div class="yum-mio">${Mio.svg("party")}</div><div class="bubble">${U.esc(toy.fun)}</div></div>`;
      row.querySelector(".px-wrap").appendChild(Pix.icon(toy.sprite));
    } });
  },

  zooParty() {
    const lvl = this.pendingZoo; this.pendingZoo = null;
    Sound.play("finish"); Confetti.burst(200);
    const power = lvl === 2;
    this.dialog(`<div class="party-mio">${Mio.svg("party")}</div>
      <p class="dlg-title">${power ? "💖 POWER ZOO! 💖" : "❤️ Happy Zoo! ❤️"}</p>
      <p>${power ? "Alle Tiere sind superglücklich!" : "Alle Tiere sind gefüttert und alle Gehege sind sauber!"}</p>
      <p><b>${power ? `Power-Serie: ⚡ ${this.zooStreak(2)}` : `Serie: 🔥 ${this.zooStreak(1)}`} ${this.zooStreak(power ? 2 : 1) === 1 ? "Tag" : "Tage"}</b><br>Bonus: +${power ? ZOO.POWER_BONUS : ZOO.HAPPY_BONUS} XP</p>
      ${power ? "" : `<p class="small">Erspiel jetzt am Gehege jedem Tier sein Spielzeug – dann wird es ein Power-Zoo 💖.</p>`}
      <button class="btn primary big" data-close>Juhu!</button>`, d => { d.dataset.rerender = "1"; });
  },

  celebrate(a, en, de) {
    Sound.play("combo"); Confetti.burst(90);
    this.dialog(`<div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p class="dlg-title">${U.esc(en)}</p><p>${U.esc(de)}</p><button class="btn primary big" data-close>Super!</button>`,
      d => { this.scene(d.querySelector("[data-bigscene]"), a, true); d.dataset.rerender = "1"; });
  },

  lockedRow() {
    return `<div class="food-row locked-row"><span class="food-ico lock-ico">🔒</span>
      <div class="food-txt"><b>Bald neu</b><span>kommt mit einem neuen Tier</span></div></div>`;
  },
  buyFriend(id) {
    const A = this.A;
    if (A.wallet < FRIEND_PRICE || !A.unlocked.includes(id) || this.hasFriend(id)) return;
    A.wallet -= FRIEND_PRICE; A.animals[id].friend = true;
    // falls heute schon gefüttert: der Neue hat auch gegessen (keine Strafe beim Kauf)
    A.friendWelcome = (A.friendWelcome || []).concat(id);
    Store.save(); this.bump("friends");
    Sound.play("coin");
    this.render(true);
  },
  friendPopup() {
    const id = this.A.friendWelcome.shift(); Store.save();
    const a = this.animal(id);
    Sound.play("finish"); Confetti.burst(150, "hearts");
    this.dialog(`<p class="dlg-title">💕 Neuer Freund!</p><div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p>Im ${a.geh}-Gehege wohnt jetzt ${FRIENDS[id].ein}!${id === "owl" ? " Sie bekommt ihre eigene Sitzstange." : ""}</p>
      <p class="small">${this.hunger(id) === 0 ? "Ab morgen" : "Ab jetzt"} braucht das Gehege 2 Portionen ${FOODS[a.food].name} am Tag. Das Spielzeug teilen sich beide.</p>
      <button class="btn primary big" data-close>Willkommen!</button>`,
      d => { this.scene(d.querySelector("[data-bigscene]"), a, true); d.dataset.rerender = "1"; });
  },
  welcomeAnimal() {
    const id = this.A.welcome.shift(); Store.save();
    const a = this.animal(id);
    Sound.play("finish"); Confetti.burst(150);
    this.dialog(`<p class="dlg-title">🎉 Neues Tier!</p><div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p>${a.der} zieht in deinen Zoo ein! ${a.er} frisst gern <b>${FOODS[a.food].name}</b>.</p>
      <button class="btn primary big" data-close>Willkommen!</button>`,
      d => { this.scene(d.querySelector("[data-bigscene]"), a, true); d.dataset.rerender = "1"; });
  },

  /* Nur zum Testen */
  skipDay() {
    const d = Store.data, A = this.A;
    Object.values(d.words).forEach(s => { s.due -= 1; });
    if (d.lastLessonDay != null) d.lastLessonDay -= 1;
    if (d.lastPlayDay != null) d.lastPlayDay -= 1;
    const pd = {}; Object.keys(d.packsDone).forEach(k => pd[+k - 1] = d.packsDone[k]); d.packsDone = pd;
    Object.values(A.animals).forEach(x => { x.fed -= 1; x.clean -= 1; if (x.toy != null) x.toy -= 1; if (x.comforted != null) x.comforted -= 1; });
    if (A.lastVisit != null) A.lastVisit -= 1;
    const zd = {}; Object.keys(A.days || {}).forEach(k => zd[+k - 1] = A.days[k]); A.days = zd;
    const xd = {}; Object.keys(A.xpDays || {}).forEach(k => xd[+k - 1] = A.xpDays[k]); A.xpDays = xd;
    if (A.lastEventRoll != null) A.lastEventRoll -= 1;
    if (A.event) A.event.day -= 1;
    if (A.revRounds) A.revRounds.day -= 1;
    Store.save();
    this.rollEvent();
  }
};

App.init();

</script>
</body>
</html>
